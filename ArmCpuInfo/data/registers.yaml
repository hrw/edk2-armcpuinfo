---
# ARM CPU Register Field Definitions
# Based on ARM DDI 0487
# Generated field definitions for all ID_AA64*_EL1 registers
#
# Memory Model Feature Registers
ID_AA64MMFR0_EL1:
  fields:
    ECV:
      bits: "63:60"
      descriptions:
        0: "FEAT_ECV not implemented."
        1: "FEAT_ECV implemented."
        2: "FEAT_ECV implemented with extras."

    FGT:
      bits: "59:56"
      descriptions:
        0: "FEAT_FGT not implemented."
        1: "FEAT_FGT implemented."

    ExS:
      bits: "47:44"
      descriptions:
        0: "FEAT_ExS not implemented."
        1: "FEAT_ExS implemented."

    TGran4:
      bits: "31:28"
      descriptions:
        0: " 4KB granule supported."
        1: " 4KB granule supported for 52-bit address."
        15: " 4KB granule not supported."

    TGran4_2:
      bits: "43:40"
      descriptions:
        0: " 4KB granule support at stage2 as above."
        1: " 4KB granule not supported at stage 2."
        2: " 4KB granule supported at stage 2."
        3: " 4KB granule supported at stage 2 for 52-bit address."

    TGran16:
      bits: "23:20"
      descriptions:
        0: "16KB granule not supported."
        1: "16KB granule supported."
        2: "16KB granule supported for 52-bit address."

    TGran16_2:
      bits: "35:32"
      descriptions:
        0: "16KB granule support at stage2 as above."
        1: "16KB granule not supported at stage 2."
        2: "16KB granule supported at stage 2."
        3: "16KB granule supported at stage 2 for 52-bit address."

    TGran64:
      bits: "27:24"
      descriptions:
        0: "64KB granule supported."
        15: "64KB granule not supported."

    TGran64_2:
      bits: "39:36"
      descriptions:
        0: "64KB granule support at stage2 as above."
        1: "64KB granule not supported at stage 2."
        2: "64KB granule supported at stage 2."

    SNSMem:
      bits: "15:12"
      descriptions:
        0: "No support for a distinction between Secure and Non-Secure Memory."
        1: "Supports a distinction between Secure and Non-Secure Memory."

    BigEnd:
      bits: "11:8"
      descriptions:
        0: "No mixed-endian support."
        1: "Mixed-endian support."

    BigEndEL0:
      bits: "19:16"
      conditional: "((Aa64Mmfr0 >>  8) & 0xf) != b0000"
      descriptions:
        0: "No mixed-endian support at EL0."
        1: "Mixed-endian support at EL0."

    ASIDBits:
      bits: "7:4"
      descriptions:
        0: "ASID: 8 Bits"
        2: "ASID: 16 Bits"

    PARange:
      bits: "3:0"
      descriptions:
        0: "32 Bits (4GB) of physical address range supported."
        1: "36 Bits (64GB) of physical address range supported."
        2: "40 Bits (1TB) of physical address range supported."
        3: "42 Bits (4TB) of physical address range supported."
        4: "44 Bits (16TB) of physical address range supported."
        5: "48 Bits (256TB) of physical address range supported."
        6: "52 Bits (4PB) of physical address range supported."
        7: "56 Bits (64PB) of physical address range supported."

